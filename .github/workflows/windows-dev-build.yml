name: Windows dev build

# Builds for a fork: an unsigned "ChemDraft (dev)" NSIS installer, uploaded as a workflow artifact.
# It installs beside the stable app (own identifier, app data and lock) and never updates it.
# Pushing a tag "striela-v*" also publishes that installer as a GitHub pre-release of the fork, so
# others can download it without a GitHub account. Official releases stay with
# windows-release.yml upstream.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    tags: ['striela-v*']

permissions:
  contents: read

concurrency:
  group: windows-dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository != 'jgassens/ChemDraft'
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: windows-dev-build
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      # The rest of the Rust gate ci.yml runs on Windows. tauri_build needs apps/desktop/dist to exist.
      - run: pnpm --filter @chemdraft/desktop build:web
      - run: cargo clippy --all-targets --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build host-native OPSIN runtime
        run: node scripts/build-opsin-runtime.mjs

      - name: Build dev NSIS installer
        env:
          CHEMDRAFT_SKIP_UPDATER_SIGNING: '1'
        run: pnpm --filter @chemdraft/desktop build --bundles nsis

      - name: Collect installer
        run: |
          $installers = @(Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)." }
          New-Item -ItemType Directory -Path installer | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination installer
          $hash = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "$hash  $($installers[0].Length) bytes  $($installers[0].Name)"

      - uses: actions/upload-artifact@v4
        with:
          name: chemdraft-dev-windows-installer
          path: installer/*.exe
          if-no-files-found: error

  # Only for a "striela-v*" tag, and the only job allowed to write to the repository.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/striela-v') && github.repository != 'jgassens/ChemDraft'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: chemdraft-dev-windows-installer
          path: installer
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(installer/*.exe)
          if [ "${#installers[@]}" -ne 1 ]; then echo "Expected one installer, found ${#installers[@]}."; exit 1; fi
          asset="ChemDraft-dev-${TAG#striela-}-windows-x64-setup.exe"
          cp "${installers[0]}" "$asset"
          sha256sum "$asset" > "$asset.sha256"
          {
            cat STRIELA-INSTALL.md
            echo
            echo "## This build"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 "$asset.sha256")\`"
            echo "- Changes in this fork: [STRIELA-CHANGES.txt](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/STRIELA-CHANGES.txt)"
          } > release-notes.md
          gh release create "$TAG" "$asset" "$asset.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "ChemDraft (dev) ${TAG#striela-}" \
            --notes-file release-notes.md
